# Copyright 2026 The Magma GPU Project
# SPDX-License-Identifier: MIT

[api]
name = "magma"
major_version = 0
minor_version = 6
patch_version = 7

[copyright]
spdx = "MIT"
holder = "The Magma GPU Project"
year = 2026

# Locations relative to the required '--out-dir' parameter where generated code
# will be placed
[out_dir_info.client]
ffi = "ffi/magma_ffi/autogenerated.rs"
header = "ffi/magma_ffi/include/magma.h"
protocol = "magma/protocol.rs"
autogenerated_rust_api = "magma/autogenerated_rust_api.rs"
rust_api = "magma/autogenerated_rust_api.rs"
protocol_impl = "magma/autogenerated_rust_api.rs"
encoder = "magma/encoder.rs"
decoder = "magma/decoder.rs"

[out_dir_info.server]
protocol = "protocol.rs"
autogenerated_rust_api = "autogenerated_rust_api.rs"
rust_api = "autogenerated_rust_api.rs"
protocol_impl = "autogenerated_rust_api.rs"
encoder = "decoder.rs"
decoder = "decoder.rs"

[ffi]
crate_name = "magma_gpu_magma"
exclude_imports = [
    "MagmaStatus",
    "MagmaVendorId",
]
status_types = [
    "MagmaStatus",
]
structure_type_header = "MagmaStructureTypeHeader"
structure_type_enum = "MagmaStructureType"
custom_imports = [
    "use magma_gpu_magma::{Error, Result};",
]

[ffi.handle_conversions.SyncObj]
rust_type = "Option<SyncObj>"
expr = "Some(unsafe { (*ptr).clone() })"
default = "None"


[encoder]
protocol_import = "use crate::protocol::*;"
custom_imports = []

[decoder]
protocol_import = "use crate::protocol::*;"
custom_imports = [
    "use magma_gpu::util::Reader;",
]
