[[commands]]
name = "magma_enumerate_physical_devices"
target = "enumerate_devices"
inputs = [
    { name = "physical_devices", type = "PhysicalDevice", array = { size = "MAGMA_MAX_PHYSICAL_DEVICES" }, direction = "inout" },
    { name = "num_devices", type = "uint32_t", direction = "inout" },
]
output = "MagmaStatus"
aspects = [ "ffi", "rust_api" ]
manual = true
response = true

